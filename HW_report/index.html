<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" type="text/css" href="index_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Forum&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">My To-Do</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Workspace</h2>
            <ul>
                <li><a href="#" class="active">專案</a></li>
                <li><a href="#">任務</a></li>
                <li><a href="#">會議</a></li>
            </ul>
            <div class="daily-word-widget">
                <h3>Daily Word</h3>
                <p>API placeholder</p>
            </div>
        </aside>
        <main class="main-content">
            <h1>To-Do List</h1>
            <div class="daily-tasks-section">
                <h2>每日固定任務</h2>
                <div class="daily-input-area">
                    <input type="text" id="dailyTaskInput" placeholder="Add a daily task...">
                    <button id="addDailyButton">Add</button>
                </div>
                <ul id="dailyTaskList">
                </ul>
            </div>
            <div class="input-area">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addButton">Add</button>
            </div>
            <ul id="taskList">
            </ul>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('taskInput');
            const addButton = document.getElementById('addButton');
            const taskList = document.getElementById('taskList');
            const dailyTaskInput = document.getElementById('dailyTaskInput');
            const addDailyButton = document.getElementById('addDailyButton');
            const dailyTaskList = document.getElementById('dailyTaskList');

            // Load tasks from localStorage
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

            // Load daily tasks
            let dailyTasks = JSON.parse(localStorage.getItem('dailyTasks'));

            // Render tasks
            function renderTasks() {
                taskList.innerHTML = '';
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `task-${index}`;
                    checkbox.checked = task.completed;
                    checkbox.addEventListener('change', () => {
                        task.completed = checkbox.checked;
                        saveTasks();
                    });
                    const label = document.createElement('label');
                    label.htmlFor = `task-${index}`;
                    label.textContent = task.text;
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'delete-button';
                    deleteButton.textContent = 'X';
                    deleteButton.addEventListener('click', () => {
                        tasks.splice(index, 1);
                        saveTasks();
                        renderTasks();
                    });
                    li.appendChild(checkbox);
                    li.appendChild(label);
                    li.appendChild(deleteButton);
                    taskList.appendChild(li);
                });
            }

            // Render daily tasks
            function renderDailyTasks() {
                dailyTaskList.innerHTML = '';
                dailyTasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `daily-${index}`;
                    checkbox.checked = task.completed;
                    checkbox.addEventListener('change', () => {
                        task.completed = checkbox.checked;
                        saveDailyTasks();
                    });
                    const label = document.createElement('label');
                    label.htmlFor = `daily-${index}`;
                    label.textContent = task.text;
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'delete-button';
                    deleteButton.textContent = 'X';
                    deleteButton.addEventListener('click', () => {
                        dailyTasks.splice(index, 1);
                        saveDailyTasks();
                        renderDailyTasks();
                    });
                    li.appendChild(checkbox);
                    li.appendChild(label);
                    li.appendChild(deleteButton);
                    dailyTaskList.appendChild(li);
                });
            }

            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            function saveDailyTasks() {
                localStorage.setItem('dailyTasks', JSON.stringify(dailyTasks));
            }

            // Add new task
            addButton.addEventListener('click', function() {
                const text = taskInput.value.trim();
                if (text) {
                    tasks.push({ text, completed: false });
                    taskInput.value = '';
                    saveTasks();
                    renderTasks();
                }
            });

            // Add new daily task
            addDailyButton.addEventListener('click', function() {
                const text = dailyTaskInput.value.trim();
                if (text) {
                    dailyTasks.push({ text, completed: false });
                    dailyTaskInput.value = '';
                    saveDailyTasks();
                    renderDailyTasks();
                }
            });

            // Schedule reset at 12pm for regular tasks only
            function checkTime() {
                const now = new Date();
                if (now.getHours() === 12 && now.getMinutes() === 0) {
                    tasks.forEach(task => {
                        if (task.completed) {
                            task.completed = false;
                        }
                    });
                    saveTasks();
                    renderTasks();
                }
            }

            // Check every minute
            setInterval(checkTime, 60000);

            // Initial render
            renderTasks();
            renderDailyTasks();
        });
    </script>
</body>
</html>
