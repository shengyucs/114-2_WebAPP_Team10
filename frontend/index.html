<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" type="text/css" href="index_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Forum&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">My To-Do</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Workspace</h2>
            <ul>
                <li><a href="#" class="active">專案</a></li>
                <li><a href="#">任務</a></li>
                <li><a href="#">會議</a></li>
            </ul>
            <div class="daily-word-widget">
                <h3>Daily Word</h3>
                <p>API placeholder</p>
            </div>
        </aside>
        <main class="main-content">
            <h1>To-Do List</h1>
            <div class="input-area">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addButton">Add</button>
            </div>
            <ul id="taskList">
                <li>
                    <input type="checkbox" id="task-1">
                    <label for="task-1">This is a sample task</label>
                    <button class="delete-button">X</button>
                </li>
                 <li>
                    <input type="checkbox" id="task-2">
                    <label for="task-2">Review design mockups</label>
                    <button class="delete-button">X</button>
                </li>
                 <li>
                    <input type="checkbox" id="task-3">
                    <label for="task-3">Prepare for team meeting</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-4">
                    <label for="task-4">Another task item</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-5">
                    <label for="task-5">Yet another task</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-6">
                    <label for="task-6">A sixth task</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-7">
                    <label for="task-7">Task number seven</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-8">
                    <label for="task-8">The eighth task</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-9">
                    <label for="task-9">Number nine</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-10">
                    <label for="task-10">Task ten</label>
                    <button class="delete-button">X</button>
                </li>
                <li>
                    <input type="checkbox" id="task-11">
                    <label for="task-11">The final task</label>
                    <button class="delete-button">X</button>
                </li>
            </ul>
        </main>
    </div>
</body>
</html>
